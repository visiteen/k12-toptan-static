<style>
:root{
  --navy:#022765;
  --deep:#031D49;
  --orange:#FC6101;
  --orange2:#ff7b24;
  --ink:#101828;
  --slate:#475467;
  --muted:#667085;
  --soft:#F5F7FA;
  --line:#E4E7EC;

  --radius:16px;

  --max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:white;line-height:1.55}
button,a{font:inherit}
a{text-decoration:none;color:inherit}
button{cursor:pointer}
.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--orange)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(42px,5.5vw,76px);line-height:1.02;letter-spacing:-.045em}
h2{font-size:clamp(32px,4vw,54px);line-height:1.08;letter-spacing:-.035em}
h3{font-size:24px;letter-spacing:-.02em}
.lead{font-size:clamp(17px,1.8vw,21px);color:#c7d1e4;max-width:720px}
.section{padding:104px 0}
.section.soft{background:var(--soft)}
.section.dark{background:var(--black);color:white}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 19px;font-weight:800;display:inline-flex;gap:10px;align-items:center;justify-content:center;transition:.2s ease}
a:focus-visible,button:focus-visible{outline:3px solid rgba(252,97,1,.38);outline-offset:3px}

.btn.primary{background:var(--orange);color:white}
.btn.primary:hover{background:#e75600;transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:white}
.btn.ghost:hover{border-color:white;background:rgba(255,255,255,.06)}
.btn.light{background:white;color:var(--deep)}
.btn.outline{background:white;border:1px solid var(--line);color:var(--deep)}
.arrow{transition:.2s}.btn:hover .arrow{transform:translateX(4px)}

/* Header */
.header{position:fixed;z-index:50;top:0;left:0;right:0;background:rgba(2,8,23,.74);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07);transition:.2s}
.header.scrolled{background:rgba(3,29,73,.97);box-shadow:0 10px 35px rgba(0,0,0,.16)}
.nav{height:82px;display:flex;align-items:center;gap:28px}
.logo-wrap{width:226px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.logo-wrap img{width:100%;height:auto;display:block;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.08))}
.logo-wrap img{width:100%;height:auto;display:block}
.navlinks{display:flex;align-items:center;gap:22px;margin-left:auto}
.navlink{color:#d7deea;font-size:13px;font-weight:700;white-space:nowrap;padding:28px 0}
.navlink:hover{color:white}
.navlink.active{color:#fff;position:relative}
.navlink.active:after{content:"";position:absolute;left:0;right:0;bottom:18px;height:2px;background:var(--orange);border-radius:99px}
section[id]{scroll-margin-top:104px}
.mega-toggle-open{color:#fff!important}

.nav-actions{display:flex;align-items:center;gap:12px}
.nav-plain{color:#fff;font-weight:700;font-size:13px}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.18);color:white;border-radius:10px;width:44px;height:44px;font-size:22px}

/* Mega menu */
.mega{position:fixed;z-index:45;left:0;right:0;top:80px;opacity:0;pointer-events:none;transform:translateY(-8px);transition:.18s;background:white;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.mega.open{opacity:1;pointer-events:auto;transform:none}
.mega-grid{display:grid;grid-template-columns:repeat(4,1fr) 1.1fr;gap:26px;padding:32px 0 36px}
.mega-col strong{display:block;color:var(--deep);font-size:13px;margin-bottom:14px}
.mega-col a{display:block;color:var(--slate);font-size:13px;padding:6px 0}
.mega-col a:hover{color:var(--orange)}
.feature-card{background:linear-gradient(145deg,var(--deep),#062d71);color:white;border-radius:16px;padding:24px;min-height:190px}
.feature-card .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffb27a;font-weight:800}
.feature-card h3{margin:10px 0 8px}
.feature-card p{font-size:13px;color:#c5d0e3}

.hero{position:relative;min-height:860px;padding:164px 0 106px;color:white;background:

.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:60px;align-items:center;position:relative;z-index:1}
.hero .eyebrow{margin-bottom:18px}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:999px;font-size:12px;font-weight:800;color:#e7edf7;backdrop-filter:blur(10px);margin-bottom:20px}
.hero-kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 18px rgba(252,97,1,.7)}
.hero h1 span{color:#ff7c25}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-meta{display:flex;gap:26px;margin-top:22px;color:#a9b7cf;font-size:12px}
.hero-meta b{color:#fff}
.hero-proof{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
.proof-card{padding:16px 16px 18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);backdrop-filter:blur(14px);border-radius:16px}
.proof-card strong{display:block;font-size:13px;color:#fff;margin-bottom:6px}
.proof-card span{display:block;font-size:11px;color:#b7c4d8;line-height:1.45}

name: Decode K12 bundle
on:
  push:
    paths:
      - ".github/workflows/decode-k12.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode bundle
        shell: python
        run: |
          import re, base64, gzip, glob
          s = ""
          for fn in sorted(glob.glob("p*.js")):
              txt = open(fn, encoding="utf-8").read()
              m = re.search(r'\\+"([A-Za-z0-9+/=]+)"', txt)
              if m:
                  s += m.group(1)
          html = gzip.decompress(base64.b64decode(s)).decode("utf-8")
          open("decompressed-site.html","w",encoding="utf-8").write(html)
      - name: Commit decoded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decompressed-site.html
          git commit -m "Decode site bundle for contact endpoint audit" || exit 0
          git push
